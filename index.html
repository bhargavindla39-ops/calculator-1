<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculus — Premium Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Noise overlay for texture -->
<div class="noise" aria-hidden="true"></div>

<!-- Toast notification -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<main class="calculator-wrapper">
  <!-- Brand -->
  <div class="brand" aria-hidden="true">
    <div class="brand-icon"><i class="fa-solid fa-calculator"></i></div>
    <span class="brand-text">Calculus</span>
  </div>

  <!-- Calculator -->
  <div class="calculator" role="application" aria-label="Calculator">

    <!-- History toggle button -->
    <button class="history-toggle" id="historyToggle" aria-label="View calculation history" title="History">
      <i class="fa-solid fa-clock-rotate-left"></i>
    </button>

    <!-- History slide panel -->
    <div class="history-panel" id="historyPanel" role="dialog" aria-label="Calculation history">
      <div class="history-header">
        <span class="history-title">History</span>
        <button class="history-close" id="historyClose" aria-label="Close history"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty" id="historyEmpty">
          <i class="fa-regular fa-clock"></i>
          <span>No calculations yet</span>
        </div>
      </div>
      <button class="history-clear-btn" id="historyClearBtn">Clear All History</button>
    </div>

    <!-- Display -->
    <div class="display" id="display">
      <div class="display-expression" id="expression" aria-live="polite"></div>
      <div class="display-result" id="result" aria-live="assertive">0</div>
    </div>

    <!-- Button Grid -->
    <div class="buttons" role="group" aria-label="Calculator buttons">
      <!-- Row 1: AC, +/-, %, ÷ -->
      <button class="btn btn-fn btn-clear" data-action="clear" aria-label="Clear all">AC</button>
      <button class="btn btn-fn" data-action="negate" aria-label="Negate">+/&minus;</button>
      <button class="btn btn-fn" data-action="percent" aria-label="Percent">%</button>
      <button class="btn btn-op" data-action="operator" data-value="/" aria-label="Divide">&divide;</button>

      <!-- Row 2: 7, 8, 9, × -->
      <button class="btn btn-num" data-action="number" data-value="7">7</button>
      <button class="btn btn-num" data-action="number" data-value="8">8</button>
      <button class="btn btn-num" data-action="number" data-value="9">9</button>
      <button class="btn btn-op" data-action="operator" data-value="*" aria-label="Multiply">&times;</button>

      <!-- Row 3: 4, 5, 6, − -->
      <button class="btn btn-num" data-action="number" data-value="4">4</button>
      <button class="btn btn-num" data-action="number" data-value="5">5</button>
      <button class="btn btn-num" data-action="number" data-value="6">6</button>
      <button class="btn btn-op" data-action="operator" data-value="-" aria-label="Subtract">&minus;</button>

      <!-- Row 4: 1, 2, 3, + -->
      <button class="btn btn-num" data-action="number" data-value="1">1</button>
      <button class="btn btn-num" data-action="number" data-value="2">2</button>
      <button class="btn btn-num" data-action="number" data-value="3">3</button>
      <button class="btn btn-op" data-action="operator" data-value="+" aria-label="Add">+</button>

      <!-- Row 5: 0 (wide), ., = -->
      <button class="btn btn-num btn-wide" data-action="number" data-value="0">0</button>
      <button class="btn btn-num" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="btn btn-eq" data-action="equals" aria-label="Equals">=</button>
    </div>
  </div>

  <!-- Keyboard hint -->
  <div class="keyboard-hint" aria-hidden="true">
    <kbd>0-9</kbd> numbers
    <kbd>+-*/</kbd> operators
    <kbd>Enter</kbd> equals
    <kbd>Esc</kbd> clear
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
